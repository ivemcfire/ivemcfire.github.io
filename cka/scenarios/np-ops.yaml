apiVersion: v1
kind: Namespace
metadata:
  name: ops
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: ops
  labels:
    app: probe
spec:
  containers:
  - name: probe
    image: busybox:1.28
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: ops
  labels:
    app: api
spec:
  containers:
  - name: api
    image: nginx:1.27
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: vault
  namespace: ops
  labels:
    app: vault
spec:
  containers:
  - name: vault
    image: nginx:1.27
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: ops
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: vault-svc
  namespace: ops
spec:
  selector:
    app: vault
  ports:
  - port: 80
    targetPort: 80
