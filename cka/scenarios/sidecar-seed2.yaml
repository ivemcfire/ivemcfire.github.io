# CKA drill seed — Deployment writing a log file, with NO sidecar and NO volume.
# Task: add a logging sidecar that streams the file, sharing an emptyDir.
#
# Apply with:  kubectl apply -f sidecar-seed2.yaml
# Reset with:  kubectl delete ns billing
#
# Do not read past this line before attempting the drill.
---
apiVersion: v1
kind: Namespace
metadata:
  name: billing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoicer
  namespace: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoicer
  template:
    metadata:
      labels:
        app: invoicer
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command:
        - sh
        - -c
        - 'while true; do echo "$(date) invoice processed" >> /var/log/invoicer.log; sleep 5; done'
