# Gateway API translation of Ingress checkout-ing (ns orders)
# CKA retake prep — header-match variant. Rule 2 routes only when BOTH
# the path prefix AND the header match.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pay-gw
  namespace: orders
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: pay.example.com
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pay-route
  namespace: orders
spec:
  parentRefs:
  - name: pay-gw
  hostnames:
  - pay.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: checkout
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /v2
      headers:
      - type: Exact
        name: X-Api-Version
        value: "2"
    backendRefs:
    - name: legacy
      port: 8080
